ber{margin:0 0 12px;text-align:center;color:var(--text);font:600 20px Georgia,serif}.lesson-title{margin:0 0 12px;color:var(--gold);font:600 18px system-ui}.lesson-copy p{margin:8px 0 13px;line-height:1.65}.lesson-copy p:last-child{margin-bottom:0}.mission{margin:24px 0 0;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--gold-light);font:500 22px Georgia,serif}.details-link{display:block;width:min(100%,420px);margin:18px auto 0;padding:14px 18px;border-radius:9px;background:var(--gold);color:#171812;text-align:center;text-decoration:none;font:600 16px system-ui}.details-link:hover{background:#d5b77d}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<script>
const keys = ['day','month','year','four','seven'];
function to22(value){while(value>22)value-=22;return value}
function formatDateInput(value){
  const digits=value.replace(/\D/g,'').slice(0,8);
  if(digits.length<=2)return digits;
  if(digits.length<=4)return `${digits.slice(0,2)}.${digits.slice(2)}`;
  return `${digits.slice(0,2)}.${digits.slice(2,4)}.${digits.slice(4)}`;
}
function readDate(value){
  const match=value.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(!match)return null;
  const day=Number(match[1]), month=Number(match[2]), year=Number(match[3]);
  const date=new Date(year,month-1,day);
  if(date.getFullYear()!==year||date.getMonth()!==month-1||date.getDate()!==day)return null;
  return {day,month,year};
}
function positions(dateString){
  const parsed=readDate(dateString);
  if(!parsed)return null;
  const {year,month,day}=parsed;
  const one=to22(day), two=month, three=to22(String(year).split('').reduce((sum,digit)=>sum+Number(digit),0));
  const four=to22(one+two), seven=to22(one+two+three);
  return {day:one,month:two,year:three,four,seven};
}
const karmicIntro="Вы находитесь в Кармических отношениях.\nКармические партнёры — это не случайные люди. Это Души, которые любят нас настолько, что согласились играть роли «злодеев» и «мучителей», чтобы мы могли расти.\nКогда вы осознаёте это, вы перестаёте быть жертвой. Вы понимаете, что карма — это не приговор. Это **инструмент вашей эволюции**.\nИ в момент, когда урок усвоен, энергетический узел развязывается. Вы становитесь свободным. И тогда — только тогда — вы готовы к переходу на новый уровень.";
const lessonDescriptions={"1":{"title":"Учиться слышать и слушать друг друга","text":"**В плюсе.** В начале таких отношений партнёрам часто легко общаться. Им интересно разговаривать, делиться мыслями, обсуждать планы. Но со временем важно не только много говорить, а действительно слышать друг друга: понимать, что именно хочет сказать партнёр, и учитывать его слова, когда вы принимаете решения.\n\n**В минусе.** Один перебивает другого, кричит, критикует или доказывает, что прав только он. Бывает и обратная ситуация: человек молчит, не говорит о том, что его задело, а потом наказывает партнёра холодом. Или говорит: «Да, я тебя понял», а после этого всё равно поступает по-своему.\n\n**Какой урок проходят партнёры.** Учиться разговаривать так, чтобы не просто высказать своё, а услышать другого. Не замалчивать недовольство, не критиковать и не пытаться победить в споре. Важно договариваться и искать решение, которое учитывает желания обоих."},"2":{"title":"Оставаться партнёрами, а не превращаться в маму и ребёнка","text":"**В плюсе.** В этих отношениях женщина остаётся любимой женщиной, а не становится для мужа мамой или обслуживающим персоналом. Она может заботиться о партнёре, но при этом не забывает о себе, своих желаниях и личных границах. Мужчина видит в ней отдельного человека, а не сравнивает её со своей мамой и не ждёт, что она будет вести себя так же.\n\n**В минусе.** Женщина постепенно превращается в ту, которая всё приносит, подаёт, стирает, готовит, заботится о детях и обо всех бытовых делах, а сама остаётся без внимания. Мужчина может упрекать её: «А вот моя мама делала по-другому». Ещё один минус — вмешательство родственников, когда мама или свекровь дают советы, настраивают партнёров друг против друга и вмешиваются в решения пары. Появляются тайны, недомолвки и обман: человек не говорит, чего хочет на самом деле, чтобы избежать конфликта.\n\n**Какой урок проходят партнёры.** Учиться строить отношения вдвоём, без роли мамы и ребёнка и без вмешательства родственников. Женщине важно не превращаться в служанку и не замалчивать свои желания. Мужчине — видеть в партнёрше отдельного человека, а не сравнивать её с мамой. Оба учатся честности и открытости."},"3":{"title":"Создавать достаток, уют и комфортную жизнь","text":"**В плюсе.** Эти отношения могут быть про красивую, обеспеченную и комфортную жизнь. В доме уютно, приятно находиться, партнёры заботятся друг о друге. Женщина остаётся желанной, раскрывает свою женственность, умеет ценить себя и не растворяется в быту. Мужчина вкладывается в семью, заботится о благополучии близких, старается, чтобы у женщины и детей было необходимое.\n\n**В минусе.** Женщина может стать главой семьи, которая всё решает за мужчину, обесценивает его и не оставляет ему места для инициативы. Тогда она может проявляться жёстко, постоянно требовать и контролировать, а мужчина — отступать и переставать брать ответственность. Бывает и другая сторона: женщина теряет ощущение собственной ценности, перестаёт заботиться о себе и всё время живёт только интересами семьи.\n\n**Какой урок проходят партнёры.** Учиться создавать достаток и комфорт вместе, не превращая отношения в борьбу за власть. Женщине важно сохранять свою ценность и женственность, а мужчине — участвовать в создании благополучия семьи. Здесь важно не только «чтобы было красиво», но и чтобы оба чувствовали себя любимыми и нужными."},"4":{"title":"Учиться уважать мужчину и выстраивать ответственность","text":"**В плюсе.** Мужчина становится опорой семьи: берёт на себя ответственность, участвует в решении бытовых и финансовых вопросов, выполняет обещания. Женщина видит и ценит то, что он делает, не обесценивает его и не пытается постоянно руководить им. При этом уважение не означает, что она должна отказаться от собственного мнения или терпеть то, что ей не подходит.\n\n**В минусе.** Партнёры начинают выяснять, кто главный: кто командует, кто принимает решения, кто кого должен слушаться. Если женщина привыкла всё контролировать, она может не давать мужчине проявляться. Если у мужчины искажено представление о мужской роли, он может давить на женщину, требовать беспрекословного подчинения и переходить к тирании.\n\n**Какой урок проходят партнёры.** Учиться выстраивать отношения, где есть ответственность, порядок и уважение границ. Мужчине важно становиться опорой, а не использовать своё положение для давления. Женщине — замечать вклад партнёра, но не отказываться от себя. Не нужно выяснять, кто главнее: важно договориться, кто за что отвечает и как принимаются общие решения."},"5":{"title":"Учиться взаимному уважению и семейной иерархии","text":"**В плюсе.** Партнёры уважают друг друга и понимают, что в семье важны не только личные желания, но и общие правила. Особенно это проявляется в воспитании детей. Родители договариваются, как воспитывать ребёнка, и не отменяют решения друг друга у него на глазах. Если один сгоряча сказал что-то не так, второй обсуждает это с ним наедине, а не разрушает его авторитет при детях.\n\n**В минусе.** Каждый вставляет свои «пять копеек», поучает, спорит и доказывает, что именно его слово должно быть последним. Один может говорить другому: «Ты ничего не знаешь, я сам тебе объясню». В семье нарушается иерархия: например, ребёнка ставят на первое место, а отношения между супругами и ответственность взрослых отходят на второй план. Или один родитель запретил, а другой тут же разрешил, чтобы выглядеть для ребёнка хорошим.\n\n**Какой урок проходят партнёры.** Учиться уважать друг друга и не бороться за авторитет. Важно договориться о семейных правилах и воспитании детей. Если вы не согласны с решением партнёра, обсуждайте это наедине. Уважение здесь взаимное: оно не означает, что нужно молча соглашаться, но и не даёт права унижать или обесценивать другого."},"6":{"title":"Учиться любить не только в лёгкие времена","text":"**В плюсе.** Партнёры умеют выбирать друг друга не только тогда, когда всё хорошо. Они проходят вместе ситуации, где нужно поддержать, проявить заботу и не отвернуться от близкого человека. Если возникают трудности с деньгами, здоровьем или работой, пара не превращает проблему в повод для взаимных обвинений.\n\n**В минусе.** Появляются сомнения: «А тот ли это человек?», «Может, мне нужно было выбрать другого?», «А вдруг мы не должны быть вместе?» Эти мысли могут оставаться внутри, и партнёры не говорят о них честно. Иногда трудности становятся проверкой, в которой каждый выясняет, кто больше сделал, кто виноват и кто должен первым всё исправить.\n\n**Какой урок проходят партнёры.** Учиться сохранять любовь и уважение в разных обстоятельствах, не требуя от партнёра быть идеальным. Важно не пытаться его переделать, а разобраться, что каждый из вас может изменить в своём отношении и поведении. Если вы выбрали друг друга, учитесь не только ждать любви, но и проявлять её."},"7":{"title":"Иметь общую цель и поддерживать движение друг друга","text":"**В плюсе.** У каждого партнёра могут быть свои интересы, друзья, работа и увлечения. Но в отношениях есть что-то общее: мечта, цель, планы на будущее или дело, которое вас объединяет. Вы смотрите в одну сторону и поддерживаете стремления друг друга. Если один хочет попробовать что-то новое, второй не обесценивает его и не говорит, что это глупость.\n\n**В минусе.** Партнёры начинают соперничать, мешают друг другу двигаться вперёд или обесценивают планы: «Зачем тебе это надо?», «Ты опять занимаешься ерундой». У каждого появляется своя дорога, общих точек соприкосновения всё меньше. Может возникнуть и перекос, когда один всё организует и тащит на себе, а второй только пользуется его усилиями.\n\n**Какой урок проходят партнёры.** Учиться двигаться вместе, не мешая друг другу развиваться. Важно иметь хотя бы одну общую цель и поддерживать партнёра на пути к ней. При этом не нужно отказываться от своих интересов: задача не в том, чтобы делать всё вместе, а в том, чтобы уважать стремления друг друга и не превращать отношения в соревнование."},"8":{"title":"Учиться честности, справедливости и договорённостям","text":"**В плюсе.** Партнёры честны друг с другом, выполняют обещания и стараются соблюдать то, о чём договорились. Они обсуждают, что для каждого допустимо в отношениях, а что нет. Решения принимаются не только в интересах одного человека: важно учитывать и желания, и потребности второго.\n\n**В минусе.** Один устанавливает правила за двоих: «Вот так можно, а вот так нельзя». Или партнёры говорят одно, а делают другое. Если кто-то нарушает обещания, скрывает правду или обманывает, доверие быстро разрушается. Иногда люди считают, что кармический союз означает, будто расставаться нельзя. Но урок не в том, чтобы терпеть любой ценой, а в том, чтобы честно пройти отношения и уважительно решить, как жить дальше.\n\n**Какой урок проходят партнёры.** Учиться строить отношения на честности и взаимных договорённостях. Не навязывать свои правила, а обсуждать их вместе. Если вы обещали что-то сделать, важно выполнить обещание. Если договорённости больше не подходят, нужно не нарушать их молча, а снова сесть и обсудить, как теперь будет устроена ваша совместная жизнь."},"9":{"title":"Учиться близости и не жить в одиночестве вдвоём","text":"**В плюсе.** Партнёры накапливают общий опыт, учатся понимать друг друга и могут быть близкими не только формально. В гармоничных отношениях один способен почувствовать настроение другого, а партнёры не боятся говорить о важном. Между ними есть уважение, душевная близость и желание поддерживать друг друга.\n\n**В минусе.** Возникает одиночество вдвоём: каждый занят своей жизнью, своими делами и интересами. Партнёры могут говорить: «Ну живём, у всех проблемы». Но на самом деле между ними холодно, нет поддержки и ощущается, что они давно перестали быть близкими. Вместе их могут удерживать только дети, ипотека или привычка.\n\n**Какой урок проходят партнёры.** Учиться не просто жить под одной крышей, а делиться друг с другом тем, что происходит в жизни. Важно возвращать общение, интерес и поддержку. Не ждать, что близость появится сама, а проявлять внимание к партнёру и говорить о том, чего вам не хватает."},"10":{"title":"Учиться договариваться о деньгах и учитывать потребности обоих","text":"**В плюсе.** Партнёры вместе обсуждают деньги, понимают, какие потребности есть у семьи, и планируют, как их закрывать. У них могут быть общие цели, накопления и совместные решения о крупных тратах. Каждый понимает, что важно другому, а не считает только свои деньги и свои желания.\n\n**В минусе.** Может не хватать денег или при достатке у каждого остаётся отдельный кошелёк: «Это моё, а это твоё». Партнёры не копят вместе, не обсуждают планы и даже важные расходы могут делить так, будто они не семья. Ещё один вариант минуса — один человек забывает о своих желаниях, стараясь закрыть потребности партнёра: молчит, терпит и подстраивается, лишь бы не было ссоры.\n\n**Какой урок проходят партнёры.** Учиться говорить о деньгах и потребностях без стыда и взаимных претензий. Важно обсуждать, как вы хотите жить, на что копить и как распределять расходы. И каждому нужно понимать свои желания: не только спрашивать «что хочет мой партнёр?», но и честно отвечать себе, что хочу я и как я хочу чувствовать себя в этих отношениях."},"11":{"title":"Перестать воевать друг с другом и направить силу на общую жизнь","text":"**В плюсе.** У пары много сил, чтобы справляться с трудностями. Когда одному тяжело, второй может поддержать и сказать: «Я рядом, давай разберёмся». Партнёры не бросают друг друга в сложный период и понимают, что сегодня помощь нужна одному, а завтра роли могут поменяться.\n\n**В минусе.** Отношения превращаются в поле боя. Один давит на другого, манипулирует, унижает или пытается сломать его морально. В тяжёлых случаях может появиться физическое насилие. Партнёры соревнуются, кто сильнее, кто больнее ударит и кто заставит другого уступить.\n\n**Какой урок проходят партнёры.** Учиться быть одной командой. Сила дана паре не для того, чтобы побеждать друг друга, а чтобы вместе преодолевать трудности, строить дом и поддерживать друг друга. Если же сила используется для запугивания и насилия, это не проявление любви и не то, что нужно терпеть."},"12":{"title":"Не терять себя и перестать спасать партнёра ценой своей жизни","text":"**В плюсе.** Один партнёр может протянуть другому руку помощи, когда тот переживает трудный период. Но помощь не превращается в спасательство: поддерживая близкого, человек не отказывается от своих границ и не берёт на себя всю ответственность за его жизнь.\n\n**В минусе.** Один терпит то, что ему не подходит, и не может выйти из тяжёлых отношений, потому что боится: «Он без меня пропадёт», «Она не справится». Партнёр может не работать, обижать, манипулировать, а второй всё равно продолжает его спасать и тянуть на себе. Со временем человек забывает о собственных желаниях и перестаёт чувствовать, где его границы.\n\n**Какой урок проходят партнёры.** Учиться говорить «нет» и не терять себя в отношениях. Если поведение партнёра причиняет боль, важно уметь сказать: «Со мной так нельзя». Нужно перестать делать за другого то, что он способен сделать сам. Иногда такие отношения помогают человеку увидеть собственную ценность и перестать быть спасателем."},"13":{"title":"Учиться проходить кризисы, ставить точку и начинать заново","text":"**В плюсе.** Партнёры способны увидеть, что старый способ жить больше не работает, и договориться о переменах. Иногда это означает поставить точку и расстаться. Иногда — оставить прежние обиды и начать строить отношения заново, уже на других условиях.\n\n**В минусе.** Человек боится перемен и продолжает жить в ситуации, которая его разрушает. Или пара вроде бы договорилась всё начать сначала, но один продолжает возвращать старую обиду при каждом конфликте. Например, партнёр сказал, что простил измену, но при любой ссоре снова напоминает о ней и использует её как способ наказать.\n\n**Какой урок проходят партнёры.** Учиться не оставаться в прежней разрушительной ситуации и не бояться перемен. Если вы решили идти дальше вместе, важно действительно договариваться о новой жизни и не использовать прошлое как оружие. Если отношения нужно завершить, важно поставить точку, а не продолжать годами возвращаться к тому, что уже закончилось."},"14":{"title":"Учиться понимать свои эмоции и не заставлять партнёра подстраиваться","text":"**В плюсе.** Партнёры могут принимать друг друга в разном настроении: сегодня один устал или расстроен, завтра другому нужно больше поддержки. Они разговаривают без криков, не требуют от близкого постоянно улыбаться и не заставляют его чувствовать то же, что чувствуют сами.\n\n**В минусе.** Начинаются эмоциональные качели: то «люблю», то «не выношу», то всё хорошо, то через минуту уже ссора. Один может проснуться не в настроении и сделать так, чтобы плохо стало всем. Или партнёр требует: «Улыбайся», «Не порть мне настроение», не давая другому права на собственные чувства. Бывает и так, что один постоянно сглаживает конфликты, боится расстроить партнёра и играет не свою роль.\n\n**Какой урок проходят партнёры.** Учиться понимать, что именно вы чувствуете, и говорить об этом без нападения на другого. Не заставлять партнёра подстраиваться под ваше настроение и не требовать, чтобы он всегда был удобным. Здесь важно уважать разницу между вами и строить отношения, где можно быть собой."},"15":{"title":"Учиться доверию и направлять страсть в близость, а не в контроль","text":"**В плюсе.** Между партнёрами есть сильное притяжение, страсть и сексуальная энергия. Они могут направлять её на близость, наслаждение друг другом, яркую совместную жизнь и достаток. Партнёры не подавляют желания друг друга и не относятся к близкому человеку как к своей собственности.\n\n**В минусе.** Появляются ревность и контроль: «Куда пошла?», «Кто тебе написал?», «Почему ты туда поехал?» Один может подавлять другого и требовать постоянных доказательств верности. Бывает и так, что страсть постепенно исчезает, партнёры отталкивают друг друга, но при этом напряжение и ревность никуда не уходят. Измена может быть одной из возможных историй, но сама по себе эта энергия не означает, что партнёр обязательно изменит.\n\n**Какой урок проходят партнёры.** Учиться доверять и понимать, что близкий человек не принадлежит вам. Нельзя заставить партнёра быть верным постоянными проверками и слежкой. Важно говорить о своей близости, желаниях и потребностях, а страсть направлять в отношения, а не в борьбу за власть."},"16":{"title":"Учиться перестраивать отношения, а не разрушать их","text":"**В плюсе.** Партнёры замечают, что в их отношениях больше не работает, и готовы многое пересмотреть. Они могут вместе изменить привычки, договорённости, быт или планы. В сложный период один не бросает другого, а помогает подняться и искать новые решения.\n\n**В минусе.** Партнёры стоят перед проблемой и думают, что всё построено неправильно, но вместо спокойных перемен начинают всё рушить. Один может говорить: «Ты должен, ты обязан», не учитывая, что происходит со вторым. Или люди цепляются за старое, хотя оно давно разрушает отношения. В такой паре кризисы могут повторяться, если ничего не менять.\n\n**Какой урок проходят партнёры.** Учиться видеть, что именно нужно убрать из отношений, а что можно сохранить и построить заново. Не надо каждый раз сносить всё до основания, но и делать вид, что ничего не происходит, тоже не получится. Важно проявлять гибкость, поддерживать партнёра в переменах и задавать себе вопрос: «Я в этих отношениях расту или только разрушаюсь?»"},"17":{"title":"Учиться быть друг другу и партнёрами, и друзьями","text":"**В плюсе.** Партнёры умеют поддерживать друг друга, говорить: «У тебя получится», «Я в тебя верю». Они не только муж и жена или любовники, но и друзья, которым есть о чём поговорить. Им интересно, что происходит в жизни друг друга, и они умеют радоваться успехам партнёра.\n\n**В минусе.** Каждый начинает полировать собственную корону: «Я здесь самый важный», «Если бы не я, у тебя бы ничего не было». Появляются высокомерие, холод, предательство или ощущение, что партнёры живут на расстоянии друг от друга. Даже если они рядом, им может быть не о чем говорить и нечего делать вместе.\n\n**Какой урок проходят партнёры.** Учиться сохранять дружбу внутри пары, быть искренними и верными друг другу. Не тянуть одеяло на себя, а замечать, что каждый вносит в отношения. Важно поддерживать партнёра, но при этом оставаться парой, а не превращаться просто в приятелей без близости."},"18":{"title":"Учиться видеть реальность, а не жить в страхах и иллюзиях","text":"**В плюсе.** В отношениях есть мягкость, забота и уют. Партнёры создают дом, где тепло и спокойно, где есть внимание друг к другу и место для детей. Они не делают выводы на основании страхов, а обсуждают то, что действительно происходит.\n\n**В минусе.** Один может идеализировать партнёра, закрывать глаза на его поступки и убеждать себя: «Он исправится», хотя близкие уже видят, что отношения причиняют боль. Бывает и наоборот: человек тревожится без причины, накручивает себя, подозревает партнёра и создаёт проблему там, где её нет. Один живёт в розовых очках, другой — в страхе, что случится что-то плохое.\n\n**Какой урок проходят партнёры.** Учиться видеть реальные поступки партнёра и не подменять их фантазиями. Важно спрашивать себя: «Что произошло на самом деле? Есть ли у меня основания тревожиться?» И если что-то беспокоит, говорить об этом, а не молча накручивать себя или оправдывать то, что причиняет боль."},"19":{"title":"Перестать соперничать и научиться дополнять друг друга","text":"**В плюсе.** В паре могут быть два ярких человека с сильными сторонами. Они не обязаны быть одинаковыми: один может быть более организованным и пунктуальным, другой — более чутким и заботливым. Когда партнёры это понимают, они дополняют друг друга и помогают каждому раскрыть свои лучшие качества.\n\n**В минусе.** Различия становятся поводом для претензий. Один говорит: «Ты опять опоздал и не выполнил обещание», а второй отвечает: «А ты не замечаешь, сколько я для тебя делаю». Партнёры начинают считать, кто больше вложил, кто лучше справляется и кто важнее. Вместо того чтобы видеть сильные стороны друг друга, они постоянно подсвечивают недостатки.\n\n**Какой урок проходят партнёры.** Учиться не сравнивать и не соревноваться, а замечать, чем каждый из вас ценен. Поддерживать партнёра в том, что ему даётся хорошо, и не требовать, чтобы он был похож на вас. Здесь важно повышать самооценку друг друга, а не использовать близость, чтобы больнее задеть."},"20":{"title":"Создавать свою семью и уважать род друг друга","text":"**В плюсе.** Партнёры строят крепкую семью, создают свои традиции и передают детям более здоровую модель отношений. Они могут объединять семьи, поддерживать связь с родственниками и принимать, что у каждого свой род и своя история.\n\n**В минусе.** Каждый тащит в новую семью правила и примеры из родительского дома: «У нас было принято вот так», «Моя мама делала по-другому». Начинается соперничество и осуждение родственников партнёра: кто из родителей лучше, чья семья правильнее, у кого «нормальный» род.\n\n**Какой урок проходят партнёры.** Учиться создавать собственную семью, а не копировать или сравнивать родительские. Уважать родных партнёра, даже если вы не согласны с их взглядами. Если в вашей семье не было традиций или ценностей, которые вам подходят, вы можете создать свои и передать их детям."},"21":{"title":"Расти вместе и уважать личные границы друг друга","text":"**В плюсе.** Партнёры приходят в отношения со своим опытом, интересами и взглядами на жизнь. Они могут делиться этим и расширять картину мира друг друга. Им есть о чём поговорить, они поддерживают развитие партнёра, путешествия, обучение и новые занятия. При этом у каждого остаётся личное пространство.\n\n**В минусе.** Один начинает контролировать другого, проверять телефон, задавать вопросы с недоверием и устанавливать правила: куда можно идти, с кем общаться, чему учиться. Или обесценивает мечты партнёра: «Зачем тебе эти курсы?», «У тебя всё равно не получится». Человек может чувствовать, что его словно посадили на цепь и не дают двигаться дальше.\n\n**Какой урок проходят партнёры.** Учиться расти рядом, но не ограничивать друг друга. Уважать интересы и личные границы партнёра, не внедряться в его пространство без разрешения и не отговаривать от того, что для него важно. Иногда урок этой пары — научиться говорить «нет» и защищать собственные границы."},"22":{"title":"Учиться лёгкости, не перекладывая ответственность","text":"**В плюсе.** В отношениях есть юмор, радость и способность не превращать каждую ситуацию в трагедию. Партнёры могут посмеяться над собой, спонтанно куда-то поехать, изменить планы и вместе получать удовольствие от жизни. При этом лёгкость не отменяет ответственности за деньги, детей и решения.\n\n**В минусе.** Один может вести себя как ребёнок, а другой вынужден всё решать и исправлять. Партнёры ждут, когда изменится кто-то один: «Вот ты начнёшь делать по-другому, тогда и я изменюсь». Бывает и так, что оба живут одним днём, тратят деньги без оглядки, набирают кредиты и не думают о последствиях. Или отношения становятся настолько тяжёлыми, что в них совсем не остаётся радости, юмора и спонтанности.\n\n**Какой урок проходят партнёры.** Учиться быть взрослыми, каждый — со своей стороны отвечать за отношения и поступки. Не ждать, что партнёр первым изменится и всё наладит. И одновременно не превращать совместную жизнь в бесконечную обязанность: оставлять место для отдыха, веселья и неожиданных приятных планов."}};
const descriptions={
  8:{group:'karmic',text:"**8 - карма справедливости.**\nПартнёров связывает кармический долг. Который возник, ещё в прошлых воплощениях. Ваши Души знакомы уже не первое воплощение. В прошлом, в ваших отношениях были нарушены: честность, верность или данные обещания. Это могло быть предательство, измена, обида, не прощение. Вы оба нарушили обещание данное друг другу. Либо кто-то из вас это сделать. И в этом воплощение вы у друг друга в долгу. Вы встретились чтобы пройти ваш урок вмести и дойти до миссии, которая прописана Судьбой на это воплощение.\n**Это не говорит о том, что вы обязаны оставаться вместе не смотря ни на что. Вы можете в итоге расстаться. Но важно правильно выходить из таких отношений. А как именно, важно учитывать вашу личную программу и вашу совместимость с этим партнёром в том числе.**\n**Если выход из кармических отношений происходит не корректный, то чаще всего в следующих отношениях ничего не складывается.**"},
  10:{group:'karmic',text:"**10 – карма финансов и понимания друг друга.**\nВ этих отношениях испытания чаще всего проходят через финансовые вопросы. Если в отношениях нет понимания и уважения, то это чаще всего отражается на деньгах. Возникают какие-то проблемы, где нужно срочно куда-то что-то заплатить. Либо происходят финансовые кризисы. Так же в этим отношениях партнёры не понимают что другому надо. Им сложно понять и услышать друг друга. Но ваша встреча произошла не просто так. Поэтому тут важно осознать для чего и зачем вы встретились.\n**Это не говорит о том, что вы обязаны оставаться вместе не смотря ни на что. Вы можете в итоге расстаться. Но важно правильно выходить из таких отношений. А как именно, важно учитывать вашу личную программу и вашу совместимость с этим партнёром в том числе.**\n**Если выход из кармических отношений происходит не корректный, то чаще всего в следующих отношениях ничего не складывается.**"},
  20:{group:'karmic',text:"**20- родовая карма.**\nВаши отношения связаны родовой кармой и семейными программами. Вы встретились, чтобы создать семью и закрыть кармический долг рода. На этом пути всегда возникают сложности в семейной жизни. Важно замечать, какие родовые сценарии проявляются в паре, что происходит так же как у вашей например мамы или бабушке. И переписыватьэтот сценарий. Ваша задача создать крепкую семью, где есть уважение и любовь.\nЭто одни из кармических союзов, когда развод считается не пройденным уроком для ваших душ. И может предаваться вашим потомкам. Поэтому самое лучше будет, это запустить изменения через себя. А именно, научитесь понимать в первую очередь себя и станьте настоящей. Все изменения начинаются с вас."},
  13:{group:'difficult',text:"**13 - одна из самых сложных совместимостей.**\nУ вас будут периоды, когда нужно будет либо поставить точку и идти дальше. Либо простить, понять  и принять партнёра.  Но тут нужно быть очень аккуратными, т.к. эти отношения без понимания себя и своей личной программы, способны вас вымотать и вы просто потухните."},
  16:{group:'difficult',text:"**16 - ваши отношения не простые, потому что они не про стабильность.**\nУ вас 2 пути. 1- либо вы постоянно растёте через эти отношения. Занимаетесь саморазвитие, прорабатываете свою ценность. Умеете отстаивать свои границы. И также уважительно относитесь к своему парнёру. И тогда выход на новый уровень во всех сферах вам обеспечен. И в реализации, и в деньгах, и в отношениях. 2- либо вы разрушите себя ради партнёра. Боитесь идти в перемены. И цепляетесь за старое, то что уже не приносит вам радости."}
};
function addFormattedCopy(parent,text){
 for(const block of text.split('\n')){
   if(!block.trim()) continue;
   const paragraph=document.createElement('p');
   const parts=block.split('**');
   parts.forEach((part,index)=>{
     if(!part)return;
     if(index%2){const strong=document.createElement('strong');strong.textContent=part;paragraph.append(strong)}
     else paragraph.append(document.createTextNode(part));
   });
   parent.append(paragraph);
 }
}
for(const input of [document.getElementById('dateA'),document.getElementById('dateB')]){
 input.addEventListener('input',()=>{
   input.value=formatDateInput(input.value);
 });
}
document.getElementById('form').addEventListener('submit',event=>{
 event.preventDefault();
 const a=document.getElementById('dateA').value,b=document.getElementById('dateB').value;
 const error=document.getElementById('error'),box=document.getElementById('results');
 if(!a||!b){error.textContent='Укажите обе даты рождения.';box.classList.remove('show');return}
 const pa=positions(a),pb=positions(b);
 if(!pa||!pb){error.textContent='Введите дату в формате 19.10.1980.';box.classList.remove('show');return}
 error.textContent='';
 const compatibility=keys.map(key=>to22(pa[key]+pb[key]));
 const found=[...new Set(compatibility.filter(value=>descriptions[value]))];
 const content=document.getElementById('classification');content.replaceChildren();
 if(!found.length){
   const paragraph=document.createElement('p');paragraph.textContent='Как же вам повезло: у вас нет кармических отношений, а значит, наладить их будет намного проще.';content.append(paragraph);
 }else{
   if(found.some(value=>descriptions[value].group==='karmic')){
     const intro=document.createElement('section');intro.className='result-block intro-block';addFormattedCopy(intro,karmicIntro);content.append(intro);
   }
   for(const value of found){
     const block=document.createElement('article');block.className='result-block';addFormattedCopy(block,descriptions[value].text);content.append(block);
   }
 }
 document.getElementById('resultTitle').textContent='Результат вашей совместимости';
 document.getElementById('missionPair').textContent=`Миссия пары — ${compatibility[4]}.`;
 box.classList.add('show');
 const lesson=lessonDescriptions[compatibility[1]];
 if(lesson){
   document.getElementById('lessonNumber').textContent=`Ваш урок — ${compatibility[1]}`;
   document.getElementById('lessonTitle').textContent=lesson.title;
   const lessonCopy=document.getElementById('lessonCopy');lessonCopy.replaceChildren();
   addFormattedCopy(lessonCopy,lesson.text);
 }
});
